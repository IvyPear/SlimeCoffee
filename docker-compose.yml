services:
  db:
    image: mysql:8.0
    container_name: slime_mysql
    restart: always
    environment:
      MYSQL_DATABASE: slime_coffee
      MYSQL_USER: slime_user
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - slime_network

  app:
    build: .
    container_name: slime_app
    restart: always
    # ports:
    #   - "3000:3000" # Dong port de bao mat, truy cap qua Nginx cong 80
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=slime_user
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=slime_coffee
    depends_on:
      - db
    networks:
      - slime_network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: always
    # ports:
    #   - "8080:8080" # Prometheus lay metric noi bo qua slime_network
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    depends_on:
      - app
      - db
    networks:
      - slime_network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    # ports:
    #   - "9090:9090" # Grafana truy van metric noi bo qua slime_network
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - cadvisor
    networks:
      - slime_network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    # ports:
    #   - "3001:3000" # Dong port de bao mat, quan tri vien truy cap qua /grafana/ o cong 80
    depends_on:
      - cadvisor
    networks:
      - slime_network

  nginx:
    image: nginx:alpine
    container_name: slime_nginx
    restart: always
    ports:
      - "80:80" # Cong duy nhat duoc phep mo ra ngoai Internet
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
      - grafana
    networks:
      - slime_network

volumes:
  db_data:

networks:
  slime_network:
    driver: bridge